packages:
  - integrations/browser-extension

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@ui-sdk/core@0.1.0-beta.13'
  - '@ui-sdk/react@0.1.0-beta.13'
  - '@ai-sdk/gateway@4.0.154'
  - '@ai-sdk/mcp@2.0.104'
  - '@ai-sdk/react@4.0.186'
  - ai@7.0.181

overrides:
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  vite: ^8.2.4
  # One OpenTelemetry API copy for the whole app: the tracing SDK accepts <1.10, and two
  # copies would keep separate global tracers, so spans would not join one trace.
  "@opentelemetry/api": 1.9.1
