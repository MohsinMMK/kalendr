    <g transform="translate(200 112) scale(.2)"><path d="M -90,-60 C -90,-115 -45,-125 0,-100 C 45,-125 90,-115 90,-60 C 90,-10 70,20 62,70 C 56,105 48,125 34,125 C 18,125 18,60 0,60 C -18,60 -18,125 -34,125 C -48,125 -56,105 -62,70 C -70,20 -90,-10 -90,-60 Z" fill="#2F9E8F"/></g>
    <rect x="250" y="-64" width="96" height="66" rx="8" fill="#17544D"/>
